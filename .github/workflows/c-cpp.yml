name: C/C++ CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar con CMake
      run: cmake -S . -B build

    - name: Compilar proyecto
      run: cmake --build build

    - name: Ejecutar programa
      run: ./build/programa
