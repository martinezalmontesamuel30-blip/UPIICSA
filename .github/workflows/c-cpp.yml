name: Comprobar C y C++

on:
  push:
    paths:
      - "Codigos/**/*.c"
      - "Codigos/**/*.cpp"
      - ".github/workflows/c-cpp.yml"
  pull_request:
    paths:
      - "Codigos/**/*.c"
      - "Codigos/**/*.cpp"
      - ".github/workflows/c-cpp.yml"
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar archivos C
        shell: bash
        run: |
          encontrados=0

          while IFS= read -r -d '' archivo; do
            encontrados=1
            echo "Compilando C: $archivo"

            gcc -Wall -Wextra -pedantic \
                -c "$archivo" \
                -o /tmp/programa.o

            echo "✓ Compilación correcta: $archivo"
          done < <(find Codigos -type f -name '*.c' -print0)

          if [ "$encontrados" -eq 0 ]; then
            echo "No se encontraron archivos C."
          fi

      - name: Comprobar archivos C++
        shell: bash
        run: |
          encontrados=0

          while IFS= read -r -d '' archivo; do
            encontrados=1
            echo "Compilando C++: $archivo"

            g++ -Wall -Wextra -pedantic \
                -c "$archivo" \
                -o /tmp/programa.o

            echo "✓ Compilación correcta: $archivo"
          done < <(find Codigos -type f -name '*.cpp' -print0)

          if [ "$encontrados" -eq 0 ]; then
            echo "No se encontraron archivos C++."
          fi
